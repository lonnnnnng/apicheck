<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">API Checker 应用图标</title>
  <desc id="desc">浅色圆角底上的模型接口连接标记和检测勾选符号。</desc>
  <defs>
    <linearGradient id="shell" x1="56" y1="52" x2="456" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#F5FAFF"/>
      <stop offset="1" stop-color="#EEF4F7"/>
    </linearGradient>
    <linearGradient id="core" x1="118" y1="102" x2="394" y2="378" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset=".48" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="glass" x1="152" y1="138" x2="360" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".94"/>
      <stop offset="1" stop-color="#DFF3FF" stop-opacity=".7"/>
    </linearGradient>
    <filter id="dockShadow" x="24" y="24" width="464" height="464" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F172A" flood-opacity=".20"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F766E" flood-opacity=".12"/>
    </filter>
    <filter id="markShadow" x="90" y="78" width="340" height="350" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <g filter="url(#dockShadow)">
    <rect x="56" y="52" width="400" height="400" rx="92" fill="url(#shell)"/>
    <rect x="57.5" y="53.5" width="397" height="397" rx="90.5" fill="none" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="3"/>
  </g>
  <g filter="url(#markShadow)">
    <rect x="118" y="102" width="276" height="276" rx="74" fill="url(#core)"/>
    <rect x="152" y="138" width="208" height="196" rx="54" fill="url(#glass)"/>
  </g>
  <path d="M186 244h48c17 0 30-13 30-30v-11" fill="none" stroke="#2563EB" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 278h-48c-17 0-30 13-30 30v10" fill="none" stroke="#0891B2" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="186" cy="244" r="25" fill="#2563EB"/>
  <circle cx="330" cy="278" r="25" fill="#0891B2"/>
  <circle cx="266" cy="203" r="22" fill="#F97316"/>
  <circle cx="251" cy="318" r="22" fill="#10B981"/>
  <path d="M198 344l40 40 88-98" fill="none" stroke="#0F766E" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 344l40 40 88-98" fill="none" stroke="#FFFFFF" stroke-opacity=".74" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
