      <stop stop-color="#2563EB"/>
      <stop offset=".52" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="118" x2="392" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".96"/>
